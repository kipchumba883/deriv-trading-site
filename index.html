<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deriv Trading Site</title>
<style>
body{background:#0f172a;color:white;font-family:sans-serif;text-align:center;padding:20px}
#price{font-size:42px;color:#00d082;margin:20px;font-weight:bold}
button{padding:16px 35px;border-radius:12px;border:none;font-size:18px;margin:8px}
.buy{background:#00d082} .sell{background:#ff4444;color:white}
.card{background:#1e293b;padding:20px;border-radius:15px;margin-top:20px}
</style>
</head>
<body>
<h2>🚀 Deriv Live Trading</h2>
<div class="card">
<div id="price">Connecting to Deriv...</div>
<div>Volatility 100 Index (R_100)</div>
<br>
<button class="buy" onclick="alert('BUY placed! Demo only')">BUY</button>
<button class="sell" onclick="alert('SELL placed! Demo only')">SELL</button>
</div>
<p style="margin-top:20px;color:#94a3b8">Your site: kipchumba883.github.io/deriv-trading-site</p>
<script>
let ws=new WebSocket('wss://ws.binaryws.com/websockets/v3?app_id=1089');
ws.onopen=()=>ws.send(JSON.stringify({ticks:'R_100'}));
ws.onmessage=(e)=>{
 let d=JSON.parse(e.data);
 if(d.tick) document.getElementById('price').innerText='V100: $ '+d.tick.quote;
}
</script>
</body>
</html>
