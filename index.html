<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deriv Live - Auto Symbols</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0f172a;color:#e2e8f0;font-family:system-ui;padding:12px}
.header,.card{background:#1e293b;border:1px solid #334155;border-radius:20px;padding:14px;margin-bottom:12px}
.header{display:flex;justify-content:space-between;align-items:center;gap:10px}
.logo{font-weight:900}.logo span{color:#ff6a00}
select{background:#0f172a;color:#fff;border:1px solid #334155;border-radius:12px;padding:8px 12px;font-weight:700;min-width:140px}
#status{font-size:12px;font-weight:800}
#price{font-size:42px;font-weight:900}
canvas{width:100%;height:280px;background:#0b1220;border-radius:14px;display:block;margin-top:10px}
.buy{background:#22c55e;color:#052e16;width:49%;padding:14px;border:0;border-radius:14px;font-weight:900}
.sell{background:#ef4444;color:#fff;width:49%;padding:14px;border:0;border-radius:14px;font-weight:900}
.stat{display:inline-block;width:23%;background:#0f172a;border-radius:10px;padding:8px;margin-top:10px;font-size:12px;text-align:center}
</style>
</head>
<body>
<div class="header">
<div class="logo">DERIV <span>LIVE</span></div>
<select id="marketSelect"><option>Loading markets...</option></select>
<div id="status" style="color:#fbbf24">● Connecting...</div>
</div>
<div class="card">
<div id="marketName">— INDEX</div>
<div id="price">—</div>
<div>Balance: $<span id="bal">10000.00</span> | Stake: <input id="stake" value="10" style="width:70px;background:#0f172a;color:#fff;border:1px solid #334155;border-radius:8px;padding:4px"></div>
<div id="stats"></div>
<canvas id="chart"></canvas>
<div style="display:flex;justify-content:space-between;margin-top:12px">
<button class="buy" onclick="trade('buy')">BUY / RISE</button>
<button class="sell" onclick="trade('sell')">SELL / FALL</button>
</div>
</div>
<script>
let ws, currentSymbol='R_100', chartPoints=[], balance=10000, high=-Infinity, low=Infinity, ticks=0;
const priceEl=document.getElementById('price'), statusEl=document.getElementById('status'), sel=document.getElementById('marketSelect'), chart=document.getElementById('chart'), ctx=chart.getContext('2d');
function connect(){
 ws=new WebSocket('wss://ws.derivws.com/websockets/v3?app_id=1089');
 ws.onopen=()=>{
  statusEl.textContent='● Loading markets...';
  ws.send(JSON.stringify({active_symbols:'brief',product_type:'basic'}));
 };
 ws.onmessage=(e)=>{
  const d=JSON.parse(e.data);
  if(d.error){statusEl.textContent='● '+d.error.message; statusEl.style.color='#ef4444'; return;}
  if(d.active_symbols){
   // Keep only synthetic indices
   const allowed=['R_10','R_25','R_50','R_75','R_100','1HZ10V','1HZ25V','1HZ50V','1HZ75V','1HZ100V','BOOM1000','CRASH1000','BOOM500','CRASH500','BOOM300','CRASH300'];
   let symbols=d.active_symbols.filter(s=>allowed.includes(s.symbol)).map(s=>s.symbol);
   if(symbols.length===0) symbols=d.active_symbols.filter(s=>s.market==='synthetic_indices').slice(0,15).map(s=>s.symbol);
   sel.innerHTML='';
   symbols.forEach(sym=>{
    const o=document.createElement('option'); o.value=sym; o.textContent=sym.replace('1HZ','Volatility ').replace('V',''); sel.appendChild(o);
   });
   currentSymbol=symbols.includes('R_100')? 'R_100' : symbols[0];
   sel.value=currentSymbol;
   statusEl.textContent='● LIVE'; statusEl.style.color='#22c55e';
   subscribe(currentSymbol);
   sel.onchange=()=>subscribe(sel.value);
   return;
  }
  if(d.tick){
   const q=Number(d.tick.quote);
   priceEl.textContent=q.toFixed(2);
   document.getElementById('marketName').textContent=d.tick.symbol+' INDEX';
   ticks++; high=Math.max(high,q); low=Math.min(low,q);
   document.getElementById('stats').innerHTML=`<div class="stat">HIGH<br><b>${high.toFixed(2)}</b></div><div class="stat">LOW<br><b>${low.toFixed(2)}</b></div><div class="stat">TICKS<br><b>${ticks}</b></div><div class="stat">VOL<br><b>${(high-low).toFixed(2)}</b></div>`;
   chartPoints.push(q); if(chartPoints.length>100) chartPoints.shift(); draw();
  }
 };
 ws.onclose=()=>{statusEl.textContent='● Reconnecting...'; setTimeout(connect,2000);};
}
function subscribe(sym){
 currentSymbol=sym; chartPoints=[]; ticks=0; high=-Infinity; low=Infinity; priceEl.textContent='...';
 if(!ws || ws.readyState!==1) return;
 ws.send(JSON.stringify({forget_all:'ticks'}));
 setTimeout(()=>ws.send(JSON.stringify({ticks:sym,subscribe:1})),300);
}
function draw(){
 const dpr=2, w=chart.clientWidth*dpr, h=280*dpr; chart.width=w; chart.height=h;
 ctx.clearRect(0,0,w,h); if(chartPoints.length<2) return;
 const min=Math.min(...chartPoints), max=Math.max(...chartPoints), range=max-min||1;
 ctx.beginPath(); ctx.strokeStyle='#ff6a00'; ctx.lineWidth=3; ctx.lineJoin='round';
 chartPoints.forEach((p,i)=>{const x=i/(chartPoints.length-1)*w, y=h-(p-min)/range*(h-40)-20; i?ctx.lineTo(x,y):ctx.moveTo(x,y);}); ctx.stroke();
}
function trade(type){
 const stake=parseFloat(document.getElementById('stake').value)||10;
 const win=Math.random()>0.5; balance+=win?stake*0.9:-stake;
 document.getElementById('bal').textContent=balance.toFixed(2);
 alert(type.toUpperCase()+' '+(win?'WON +$'+(stake*0.9).toFixed(2):'LOST -$'+stake));
}
connect();
</script>
</body>
</html>
