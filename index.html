<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deriv Live Terminal</title>
<style>
body{background:#0f172a;color:#fff;font-family:sans-serif;margin:0;padding:12px}
.card{background:#1e293b;border:1px solid #334155;border-radius:16px;padding:16px;margin-bottom:12px}
select,input,button{padding:10px;border-radius:10px;border:1px solid #334155}
button{font-weight:bold;cursor:pointer}
#price{font-size:2.5rem;font-weight:800}
canvas{width:100%;height:260px;background:#0b1220;border-radius:12px}
.buy{background:#22c55e;color:#000;width:49%}.sell{background:#ef4444;color:#fff;width:49%}
</style>
</head>
<body>
<div class="card" style="display:flex;justify-content:space-between;align-items:center">
<div style="font-weight:800">DERIV <span style="color:#ff6a00">LIVE</span></div>
<select id="marketSelect">
<option value="R_100">R_100</option>
<option value="R_75">R_75</option>
<option value="R_50">R_50</option>
<option value="R_25">R_25</option>
<option value="R_10">R_10</option>
<option value="1HZ100V">Volatility 100</option>
<option value="1HZ75V">Volatility 75</option>
<option value="1HZ50V">Volatility 50</option>
<option value="1HZ25V">Volatility 25</option>
<option value="1HZ10V">Volatility 10</option>
<option value="BOOM1000">BOOM 1000</option>
<option value="CRASH1000">CRASH 1000</option>
<option value="BOOM500">BOOM 500</option>
<option value="CRASH500">CRASH 500</option>
</select>
<span id="status" style="color:#fbbf24">● Connecting...</span>
</div>

<div class="card">
<div id="marketName">R_100 INDEX</div>
<div id="price">—</div>
<div>Balance: $<span id="bal">10000.00</span> | Stake: <input id="stakeInput" value="10.00" style="width:70px"></div>
<canvas id="chart"></canvas>
<div style="display:flex;justify-content:space-between;margin-top:12px">
<button class="buy" onclick="executeTrade('buy')">BUY / RISE</button>
<button class="sell" onclick="executeTrade('sell')">SELL / FALL</button>
</div>
</div>

<script>
let currentSymbol='R_100';
let balance=10000;
let chartPoints=[];
let ws;
const priceEl=document.getElementById('price');
const statusEl=document.getElementById('status');
const marketSelect=document.getElementById('marketSelect');
const canvas=document.getElementById('chart');
const ctx=canvas.getContext('2d');

function connect(){
 ws=new WebSocket('wss://ws.derivws.com/websockets/v3?app_id=1089');
 ws.onopen=()=>{
  statusEl.textContent='● LIVE';statusEl.style.color='#22c55e';
  subscribeToMarket(currentSymbol);
 };
 ws.onmessage=(msg)=>{
  const d=JSON.parse(msg.data);
  if(d.tick){priceEl.textContent=d.tick.quote.toFixed(2);chartPoints.push(d.tick.quote);if(chartPoints.length>100)chartPoints.shift();draw();}
 };
 ws.onclose=()=>{statusEl.textContent='● Reconnecting...';setTimeout(connect,2000);};
}
function subscribeToMarket(symbol){
 currentSymbol=symbol;
 document.getElementById('marketName').innerText=symbol+' INDEX';
 chartPoints=[];
 if(!ws || ws.readyState!==1){console.warn('[WS] Could not subscribe - socket not ready');return;}
 ws.send(JSON.stringify({forget_all:'ticks'}));
 ws.send(JSON.stringify({ticks:symbol,subscribe:1}));
 console.log('[WS] Subscribed to '+symbol);
}
function draw(){
 const w=canvas.width=canvas.clientWidth*2;const h=canvas.height=260*2;
 ctx.clearRect(0,0,w,h);if(chartPoints.length<2)return;
 const min=Math.min(...chartPoints),max=Math.max(...chartPoints);const range=max-min||1;
 ctx.beginPath();ctx.strokeStyle='#ff6a00';ctx.lineWidth=3;
 chartPoints.forEach((p,i)=>{const x=(i/(chartPoints.length-1))*w;const y=h-((p-min)/range)*(h-40)-20;i==0?ctx.moveTo(x,y):ctx.lineTo(x,y);});ctx.stroke();
}
function updateBalanceDisplay(){document.getElementById('bal').innerText=balance.toFixed(2);}
function executeTrade(type){
 let stake=parseFloat(document.getElementById('stakeInput').value);
 if(isNaN(stake)||stake<0.5){alert('Min 0.50');return;}
 if(stake>balance){alert('No balance');return;}
 const win=Math.random()>0.5;const payout=win?stake*0.95:-stake;balance+=payout;updateBalanceDisplay();
 const txt=(win?'WON +$'+(stake*0.95).toFixed(2):'LOST -$'+stake.toFixed(2));
 const toast=document.createElement('div');toast.style.cssText='position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:'+(win?'#22c55e':'#ef4444')+';color:#fff;padding:12px 28px;border-radius:60px;z-index:9999';toast.textContent=type.toUpperCase()+' '+txt;document.body.appendChild(toast);setTimeout(()=>toast.remove(),3000);
}
marketSelect.addEventListener('change',function(){const s=this.value;if(s===currentSymbol)return;subscribeToMarket(s);});
connect();
</script>
</body>
</html>
